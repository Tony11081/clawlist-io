<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Scoped agent capacity approval</title>
  <desc id="desc">A central approval gate connects layered budget controls to a time-limited capacity grant and verified agent work.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1480" y2="850" gradientUnits="userSpaceOnUse">
