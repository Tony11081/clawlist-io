<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Portable agent plugin architecture</title>
  <desc id="desc">A central modular capability core connects to three distinct agent runtime frames.</desc>
  <defs>
