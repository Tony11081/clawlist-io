<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Managed agent harness and execution environments</title>
  <desc id="desc">A central orchestration core connects to three execution environments and coordinated agent nodes.</desc>
  <defs>
