<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bounded agent merge loop</title>
  <desc id="desc">A technical agent loop moves through code, review, checks, and merge gates with a distinct stop boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#09111f"/>
      <stop offset="1" stop-color="#171829"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#6366f1" stop-opacity=".26"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="46"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#334155" stroke-width="1" opacity=".2">
    <path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/>
    <path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/>
  </g>
  <ellipse cx="790" cy="450" rx="600" ry="350" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M525 230C750 80 1080 170 1160 410C1240 650 990 790 745 720C580 675 490 555 510 415" fill="none" stroke="url(#edge)" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g fill="#0f172a" stroke="#475569" stroke-width="3">
    <rect x="250" y="330" width="310" height="240" rx="48"/>
    <rect x="670" y="145" width="310" height="210" rx="48"/>
    <rect x="1015" y="475" width="310" height="210" rx="48"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M333 427l53-53 53 53 53-53" stroke="#38bdf8" stroke-width="13"/>
    <path d="M333 486h159" stroke="#64748b" stroke-width="11"/>
    <circle cx="825" cy="250" r="58" stroke="#a78bfa" stroke-width="9"/>
    <path d="M793 250l22 23 43-48" stroke="#c4b5fd" stroke-width="12"/>
    <path d="M1090 548h160M1090 592h105" stroke="#64748b" stroke-width="10"/>
    <path d="M1217 590l26 26 50-57" stroke="#38bdf8" stroke-width="12"/>
  </g>
  <g>
    <rect x="650" y="675" width="300" height="78" rx="39" fill="#111827" stroke="url(#edge)" stroke-width="5"/>
    <circle cx="715" cy="714" r="17" fill="#38bdf8"/>
    <path d="M765 714h125" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g fill="#cbd5e1">
    <circle cx="509" cy="414" r="10"/><circle cx="682" cy="231" r="10"/><circle cx="967" cy="276" r="10"/><circle cx="1138" cy="485" r="10"/>
  </g>
