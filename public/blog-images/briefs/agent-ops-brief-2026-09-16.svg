<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Auditable model routing</title>
  <desc id="desc">A prompt passes through a three-lane routing control and reaches one selected model with an attached receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#18162a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6366f1" stop-opacity=".3"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="64"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#334155" stroke-width="1" opacity=".18"><path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/><path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/></g>
  <ellipse cx="820" cy="450" rx="620" ry="320" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="#0f172a" stroke-width="5">
    <circle cx="235" cy="450" r="76" stroke="#64748b"/>
    <path d="M505 245h330l115 205-115 205H505L390 450z" stroke="url(#accent)"/>
    <circle cx="1210" cy="255" r="82" stroke="#475569"/>
    <circle cx="1210" cy="450" r="82" stroke="#38bdf8"/>
    <circle cx="1210" cy="645" r="82" stroke="#475569"/>
    <rect x="1370" y="355" width="120" height="190" rx="24" stroke="#8b5cf6"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M311 450h79M950 450h178" stroke="#94a3b8" stroke-width="9"/>
    <path d="M910 417l40 33-40 33M1087 417l41 33-41 33" stroke="#cbd5e1" stroke-width="9"/>
    <path d="M505 365h190M505 450h260M505 535h225" stroke="#64748b" stroke-width="12"/>
    <path d="M505 450h260" stroke="url(#accent)" stroke-width="12"/>
    <path d="M1292 450h78" stroke="#8b5cf6" stroke-width="8"/>
    <path d="M1402 405h55M1402 450h55M1402 495h38" stroke="#cbd5e1" stroke-width="9"/>
